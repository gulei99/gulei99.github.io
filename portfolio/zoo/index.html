  <h1>南京红山森林动物园河马馆设计</h1>
  
  <div class="page-intro"><p>这个方案的主题是“尼罗河水域中的事件剪影”，核心概念叫“木中窥人”：看与被看的关系反过来——动物才是园子的主人，人才是被观察的那个。所以设计处处从动物出发：给它们足够大、足够有趣的活动空间，游客的路线则藏在旁边，尽量不打扰它们的生活。展馆里还用了 VR、AR、天幕和触摸屏，边逛边看，就能了解动物在野外是怎么生活的。</p>
