<header class="page-header">
  <h1>南京红山森林动物园河马馆设计</h1>
  
  <div class="page-intro"><p>这个方案叫“尼罗河水域中的事件剪影”，核心概念是“木中窥人”——把看与被看反过来：动物才是园子的主人，人不过是被看的那一个。于是游客的路被藏进绿荫里，河马的地盘被放到最大；留给人活动的屋子反而花了不少心思，只为让它们少被打扰。展馆里散落着 VR、AR、天幕和触摸屏，边走边看，就知道它们在野外是怎么过日子的。</p>
